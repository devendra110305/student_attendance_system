{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Student Records</h2>
    <form method="POST" class="row-form">
        <input type="text" name="roll_no" placeholder="Roll No" required>
        <input type="text" name="name" placeholder="Student Name" required>
        <input type="text" name="class_name" placeholder="Class (e.g. BCA-3)">
        <button type="submit">Add Student</button>
    </form>

    <table>
        <thead>
            <tr><th>#</th><th>Roll No</th><th>Name</th><th>Class</th><th>Action</th></tr>
        </thead>
        <tbody>
        {% for s in students %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ s.roll_no }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.class_name }}</td>
                <td><a class="btn-del" href="{{ url_for('delete_student', sid=s.id) }}"
                       onclick="return confirm('Delete this student?')">Delete</a></td>
            </tr>
        {% else %}
            <tr><td colspan="5" class="empty">No students yet.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
